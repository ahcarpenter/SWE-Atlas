# Claude Opus 5.5 on claude-code with the addyosmani/agent-skills pack: the leaderboard settings of
# claude-opus-5-5.yaml plus `skills`. Pairs with claude-opus-5-5-skills-baseline.yaml, which differs
# only in having no `skills`. Harbor copies each skill under .agents/skills (the pack version is
# recorded in skills-lock.json) into the task sandbox, where Claude Code loads it as a user skill.
# Keys in .env or the environment: ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN (see CLOUD.md).
#   ./run.sh configs/claude-opus-5-5-skills-pack.yaml
n_attempts: 3
n_concurrent_trials: 24

# Only infrastructure failures are retried; the exceptions below (an agent timeout among
# them) are real outcomes and are graded as they ran.
retry:
  max_retries: 3
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
  exclude_exceptions:
    - AgentSafetyRefusalError
    - AgentAuthenticationError
    - ModelNotFoundError
    - ApiUsageLimitError
    - OutputTokenExceededError
    - ContextWindowExceededError
    - OutputLengthExceededError
    - ContextLengthExceededError
    - VerifierOutputParseError
    - RewardFileEmptyError
    - AgentTimeoutError

environment:
  type: modal

agents:
  - name: claude-code
    model_name: anthropic/claude-opus-5-5
    extra_allowed_hosts:
      - api.anthropic.com
    kwargs:
      reasoning_effort: max
      version: 2.1.293
      disallowed_tools: WebSearch,WebFetch
    skills:
      - .agents/skills

datasets:
  - path: data/qa
  - path: data/rf
  - path: data/tw
